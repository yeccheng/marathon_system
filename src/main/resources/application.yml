# 马拉松赛事管理系统 - 公共配置（可提交）
# 本机密码 / 绝对路径见 application-local.yml（已 gitignore）
# 模板：application-local.yml.example ；说明：docs/答辩环境配置说明.md
server:
  port: 8081

spring:
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/marathon_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    # password 由 application-local.yml 覆盖
  # Spring Boot 2.6+ 默认 PathPattern，与 springfox/Knife4j OpenAPI2 不兼容，需改回 ant_path_matcher
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # 文件上传大小限制（与业务校验 5MB 一致）
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  # Redis 主机端口公共默认；密码由 local profile 覆盖
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

mybatis:
  configuration:
    # 打印 SQL 日志，便于调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名映射：数据库下划线列名 自动映射为 Java 驼峰属性
    map-underscore-to-camel-case: true

logging:
  level:
    com.ape.marathon: debug

# ========== JWT 配置（登录鉴权） ==========
# secret 长度建议 >= 32 字节（HS256 要求密钥至少 256 bit）
# expire：过期时间，单位毫秒，默认 2 小时 = 7200000
jwt:
  secret: marathon-jwt-secret-key-2026-must-be-long-enough
  expire: 7200000

# Shiro：关闭默认登录跳转页，全部走前后端分离 + JWT
shiro:
  loginUrl: /api/login
  successUrl: /
  unauthorizedUrl: /api/login

# ========== 赛事封面上传 / 短信 / 支付 ==========
marathon:
  upload:
    # 相对路径即可；本机绝对路径可在 application-local.yml 覆盖
    path: uploads/
    url-prefix: /uploads/
  # 短信：local=站内信+sms_log；aliyun=配置密钥后优先外发（无密钥自动降级）
  sms:
    provider: local
    expose-code: true
    sign-name: 发令台
    template-code: ""
    access-key-id: ""
    access-key-secret: ""
  # 支付收银台：mock 即时到账并写 payment_log；填入商户号后渠道标签走真实标识
  pay:
    gateway: mock
    merchant-name: 发令台赛事组委会
    wechat-mch-id: ""
    alipay-app-id: ""

# ========== Knife4j 接口文档 ==========
# 访问地址：http://localhost:8081/doc.html
# production: true 时生产环境屏蔽文档页（线上建议开启）
knife4j:
  enable: true
  production: false
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: 实体类列表
